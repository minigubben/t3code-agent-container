name: ${COMPOSE_PROJECT_NAME:-agent-harness}

services:
  agent:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/agent/Dockerfile
    cap_add:
      - SYS_ADMIN
    environment:
      AGENT_UID: ${AGENT_UID:-1000}
      AGENT_GID: ${AGENT_GID:-1000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
      TZ: ${TZ:-UTC}
      DOCKER_HOST: unix:///run/user/${AGENT_UID:-1000}/docker.sock
      T3_PORT: "3773"
      T3CODE_HOME: /home/agent/.t3
      NPM_CONFIG_CACHE: /home/agent/.t3/npm-cache
    ports:
      - ${T3_WEB_PORT:-3773}:3773
    devices:
      - /dev/fuse:/dev/fuse
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
      - systempaths=unconfined
    tmpfs:
      - /tmp
      - /run
      - /run/user/${AGENT_UID:-1000}
    volumes:
      - agent-home:/home/agent
    healthcheck:
      test:
        - CMD-SHELL
        - test -S /run/user/${AGENT_UID:-1000}/docker.sock && DOCKER_HOST=unix:///run/user/${AGENT_UID:-1000}/docker.sock docker info >/dev/null 2>&1 && curl --fail --silent http://127.0.0.1:3773 >/dev/null
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

volumes:
  agent-home:
  remote-workspace:
